# Use the built-in firmware framebuffer/SimpleDRM until the real root mounts.
# Plymouth can also request DRM drivers, so omitting the kms module alone is
# insufficient. Keep storage, input, crypto, and simpledrm available for LUKS.
omit_drivers+=" amdgpu radeon i915 xe nouveau nova_core nova_drm nvidia nvidia_modeset nvidia_drm nvidia_uvm "
