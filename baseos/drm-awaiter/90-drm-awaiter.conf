# Load NVIDIA, Nouveau and Nova from the real root (drm-awaiter), never from
# the initramfs. Plymouth can also request DRM drivers, so omitting the kms
# module alone is insufficient. Every other GPU driver follows dracut's usual
# selection (in a host-only image, the drivers this computer's displays use),
# so the boot splash and LUKS prompt are drawn by the real driver at the
# monitor's resolution instead of SimpleDRM's firmware framebuffer, which
# many GPUs start at a lower resolution that the monitor stretches.
omit_drivers+=" nouveau nova_core nova_drm nvidia nvidia_modeset nvidia_drm nvidia_uvm "
